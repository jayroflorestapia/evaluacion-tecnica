server.port=8081
spring.datasource.url=jdbc:h2:mem:usuarios;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
transacciones.url=http://localhost:8082
# Llave Base64 de 32 bytes. Sobrescribir con la variable AES_SECRET_KEY en produccion.
app.aes.secret-key=${AES_SECRET_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
